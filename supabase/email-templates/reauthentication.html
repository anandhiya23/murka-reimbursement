<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="460" cellpadding="0" cellspacing="0" style="background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;overflow:hidden;">
        <tr>
          <td style="padding:32px 40px 8px;">
            <span style="font-size:20px;font-weight:700;letter-spacing:0.08em;color:#111111;">MURKA</span>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 40px 0;">
            <h1 style="margin:0 0 12px;font-size:19px;font-weight:600;color:#111111;">Verification code</h1>
            <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#52525b;">
              Enter this code to confirm it's you:
            </p>
            <div style="font-size:30px;font-weight:700;letter-spacing:0.3em;color:#111111;background:#f4f4f5;border-radius:8px;padding:16px 0;text-align:center;">{{ .Token }}</div>
            <p style="margin:20px 0 0;font-size:12px;line-height:1.6;color:#a1a1aa;">This code expires shortly. Don't share it with anyone.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 40px 32px;">
            <hr style="border:none;border-top:1px solid #f0f0f1;margin:0 0 16px;">
            <p style="margin:0;font-size:12px;color:#a1a1aa;">Didn't request this? Ignore this email.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
