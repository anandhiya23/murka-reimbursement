<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width" />
    <!-- Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link href="https://cdn.datatables.net/v/dt/dt-2.3.5/r-3.0.7/datatables.min.css" rel="stylesheet" integrity="sha384-BPLVaqLd/VHVzAwnRw5/zfDXOt6A3og8QHnmyFlLy/air1BZuwu0quAVk1Z6NkGB" crossorigin="anonymous">
    <script src="https://cdn.datatables.net/v/dt/dt-2.3.5/r-3.0.7/datatables.min.js" integrity="sha384-R5oraIW0WVnbh3qO11mw/9A6JxGWPTdP/SreINwDA+r+CqRMUHAyIUXD9cPSl/pS" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="reimburse.css" />
  </head>

  <body>
    <div class="main-grid">
      <!-- Left: Form -->
      <div class="container">
        <h2>Murka Reimbursement Tool</h2>
        <form id="reimbursementForm">
          <label>Requester Name</label>
          <select name="requester" id="requester" required>
            <option value=""></option>
          </select>

          <!-- START: dynamic expense items -->
          <div id="items">
            <div class="expense-item" data-index="0" style="border:1px solid var(--gray-300); padding:12px; border-radius:8px; margin-bottom:1em; box-shadow: 0px 1px 7px 0px rgb(0 0 0 / 8%);">
              <label>Project</label>
              <select name="project2" class="project2" required>
                <option value=""></option>
              </select>
              <label>Expense Date</label>
              <input type="date" name="expenseDate" class="expenseDate" style="width: 50%;" required>
              <label>Description / Purpose</label>
              <textarea name="description" class="description" rows="2"></textarea>
              <label>Amount (IDR)</label>
              <input type="text" name="amount" class="amount" required>
              <label>Proof Files (JPG / PNG / HEIC)</label>
              <input type="file" class="itemFiles" name="receipt" accept=".jpg,.jpeg,.png,.heic" multiple required>
              <div style="text-align:right">
                <button type="button" class="remove-item" style="display:none; background:#f8d7da; color:#721c24; border:none; padding:6px 10px; border-radius:6px; cursor:pointer;">Remove</button>
              </div>
            </div>
          </div>

          <button type="button" id="addItemBtn" style="background:transparent; color:var(--primary); border:1px dashed var(--primary); padding:0.6em 1em; margin-bottom:1em; border-radius:8px; cursor:pointer;">+ Add another expense</button>

          <label>Approver</label>
          <select name="approver" id="approver" required>
            <option value="">Loading...</option>
          </select>

          <button type="submit">Submit</button>
        </form>
        <div id="status"></div>
      </div>

    <!-- Right: Table -->
    <div class="table-container">
      <table id="reimbursementTable" class="display">
        <thead>
          <tr>
            <th>Requester</th>
            <th>Project</th>
            <th>Date</th>
            <th>Description</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="reimburse.js"></script>
</body>
</html>
